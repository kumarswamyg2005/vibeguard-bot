[project]
name = "vibeguard"
version = "0.1.0"
description = "Opt-in security engineer for Supabase apps: finds missing RLS and leaked keys, opens tested fix PRs."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28",
    "psycopg[binary]>=3.2",
    "pglast>=6",
    "PyJWT[crypto]>=2.10",
    "jinja2>=3.1",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "respx>=0.22",
    "freezegun>=1.5",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vibeguard"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "ASYNC", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."

[[tool.mypy.overrides]]
module = ["pglast.*", "respx.*", "freezegun.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
