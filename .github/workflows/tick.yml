name: tick
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# never two ticks at once; a long tick queues the next
concurrency:
  group: tick
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: supabase/setup-cli@v1   # the self-review gate runs ephemeral stacks
      - run: uv sync
      - name: tick
        run: python -m vibeguard.tick
        env:
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
