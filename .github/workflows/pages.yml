name: pages
on:
  schedule:
    - cron: "5 0 * * 4"   # Thursdays, after the last tick window
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - name: build site
        run: python -m vibeguard.site.build
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          VIBEGUARD_INSTALL_URL: ${{ vars.VIBEGUARD_INSTALL_URL }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
